[project]
name = "stance-ledger"
version = "0.1.0"
description = "Keeping a disagreement in an agent's memory: a rolling summary vs a stance ledger, tested on Serbian news about the 2024-2025 protest movement"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "anthropic>=0.69",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stance-ledger = "stance_ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stance_ledger"]

[tool.ruff]
line-length = 100
